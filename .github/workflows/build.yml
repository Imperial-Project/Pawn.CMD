name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - "*"
      - "*/*"
      - "**"
  pull_request:
    branches:
      - "*"
      - "*/*"
      - "**"
env:
  PLUGIN_VERSION: 3.4.0-omp

jobs:
  build-linux-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          clean: true
          submodules: recursive
          fetch-depth: 0

      - name: Install packages
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y g++-multilib gcc-multilib libc6-dev-i386

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.2' 

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.25.1'
    
      - name: Install latest conan
        run: |
          python -m pip install --upgrade pip
          pip3 install conan==1.57.0
  
      - name: Setup Conan profile
        run: |
          conan profile new default --detect --force
          conan profile update settings.compiler.version=12 default
          conan profile update settings.compiler=gcc default

      - name: Generate build files
        run: mkdir build && cd build && cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32

      - name: Build
        run: |
          cd build
          cmake --build . --config Release

      - name: Create artifact
        run: tar -czf pawncmd-$PLUGIN_VERSION-linux.tar.gz -C build pawncmd.so -C ../src Pawn.CMD.inc

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pawncmd-${{ env.PLUGIN_VERSION }}-linux
          path: pawncmd-${{ env.PLUGIN_VERSION }}-linux.tar.gz
